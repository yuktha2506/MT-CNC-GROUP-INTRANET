    { key: 'firefox', name: 'Mozilla Firefox', mark: 'FF', color: '#e66000', download: 'https://www.mozilla.org/firefox/new/' }
  ];
  const LAUNCHER_SETUP = "@echo off\r\nrem MT CNC browser launcher - one-time setup for this Windows user.\r\nrem Version 2. Lets the intranet open business apps in Edge, Chrome or Firefox and\r\nrem start remote-support tools (Quick Assist, AnyDesk, UltraViewer, TeamViewer QuickSupport).\r\nrem No administrator rights needed. To remove:  Install-MTCNC-Browser-Launcher.bat /uninstall\r\nsetlocal\r\nset \"SETUPFILE=%~f0\"\r\nset \"DIR=%LOCALAPPDATA%\\MTCNC\\BrowserLauncher\"\r\nset \"KEY=HKCU\\Software\\Classes\\mtcnc-browser\"\r\nset \"TKEY=HKCU\\Software\\Classes\\mtcnc-tool\"\r\n\r\nif /i \"%~1\"==\"/uninstall\" (\r\n  reg delete \"%KEY%\" /f >nul 2>&1\r\n  reg delete \"%TKEY%\" /f >nul 2>&1\r\n  if exist \"%DIR%\" rmdir /s /q \"%DIR%\"\r\n  echo MT CNC browser launcher removed.\r\n  pause\r\n  exit /b 0\r\n)\r\n\r\nif not exist \"%DIR%\" mkdir \"%DIR%\"\r\npowershell -NoProfile -ExecutionPolicy Bypass -Command \"$t=[IO.File]::ReadAllText($env:SETUPFILE); $m='###'+'PS1###'; $i=$t.LastIndexOf($m); [IO.File]::WriteAllText((Join-Path $env:DIR 'Open-InBrowser.ps1'), $t.Substring($i+$m.Length).TrimStart(), (New-Object Text.UTF8Encoding $true))\"\r\nif errorlevel 1 goto failed\r\nif not exist \"%DIR%\\Open-InBrowser.ps1\" goto failed\r\n\r\nreg add \"%KEY%\" /ve /t REG_SZ /d \"URL:MT CNC browser launcher\" /f >nul || goto failed\r\nreg add \"%KEY%\" /v \"URL Protocol\" /t REG_SZ /d \"\" /f >nul || goto failed\r\nreg add \"%KEY%\\shell\\open\\command\" /ve /t REG_SZ /d \"\\\"%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\\\" -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File \\\"%DIR%\\Open-InBrowser.ps1\\\" \\\"%%1\\\"\" /f >nul || goto failed\r\nreg add \"%TKEY%\" /ve /t REG_SZ /d \"URL:MT CNC remote-support tools\" /f >nul || goto failed\r\nreg add \"%TKEY%\" /v \"URL Protocol\" /t REG_SZ /d \"\" /f >nul || goto failed\r\nreg add \"%TKEY%\\shell\\open\\command\" /ve /t REG_SZ /d \"\\\"%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\\\" -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File \\\"%DIR%\\Open-InBrowser.ps1\\\" \\\"%%1\\\"\" /f >nul || goto failed\r\n\r\necho.\r\necho  MT CNC launcher version 2 is installed (browsers and remote-support tools).\r\necho  Go back to the intranet and try again.\r\necho  If the browser asks \"Open MT CNC browser launcher?\", tick \"Always allow\" and choose Open.\r\necho.\r\npause\r\nexit /b 0\r\n\r\n:failed\r\necho.\r\necho  Setup did not finish. Please contact IT.\r\npause\r\nexit /b 1\r\n###PS1###\r\n# MT CNC browser launcher (version 2). Called by Windows for intranet links like:\r\n#   mtcnc-browser:open?b=chrome&u=https%3A%2F%2Fexample.com%2F   open a link in a browser\r\n#   mtcnc-tool:open?t=anydesk                                        start a remote-support tool\r\n# Tools run from their installed location, or else from a portable copy in the IT\r\n# Utilities folder. A copy is only started if it carries a valid digital signature\r\n# from that tool's publisher. Nothing here needs or asks for an administrator password.\r\nparam([string]$Link = '')\r\n$ErrorActionPreference = 'Stop'\r\n$Title = 'MT CNC browser launcher'\r\n\r\n$Browsers = [ordered]@{\r\n  chrome  = @{ Name = 'Google Chrome';   Exe = 'chrome.exe';  Download = 'https://www.google.com/chrome/';\r\n               Paths = @('%ProgramFiles%\\Google\\Chrome\\Application\\chrome.exe', '%ProgramFiles(x86)%\\Google\\Chrome\\Application\\chrome.exe', '%LOCALAPPDATA%\\Google\\Chrome\\Application\\chrome.exe') }\r\n  edge    = @{ Name = 'Microsoft Edge';  Exe = 'msedge.exe';  Download = 'https://www.microsoft.com/edge/download';\r\n               Paths = @('%ProgramFiles(x86)%\\Microsoft\\Edge\\Application\\msedge.exe', '%ProgramFiles%\\Microsoft\\Edge\\Application\\msedge.exe') }\r\n  firefox = @{ Name = 'Mozilla Firefox'; Exe = 'firefox.exe'; Download = 'https://www.mozilla.org/firefox/new/';\r\n               Paths = @('%ProgramFiles%\\Mozilla Firefox\\firefox.exe', '%ProgramFiles(x86)%\\Mozilla Firefox\\firefox.exe', '%LOCALAPPDATA%\\Mozilla Firefox\\firefox.exe') }\r\n  brave   = @{ Name = 'Brave';           Exe = 'brave.exe';   Download = 'https://brave.com/download/';\r\n               Paths = @('%ProgramFiles%\\BraveSoftware\\Brave-Browser\\Application\\brave.exe', '%ProgramFiles(x86)%\\BraveSoftware\\Brave-Browser\\Application\\brave.exe', '%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\Application\\brave.exe') }\r\n  opera   = @{ Name = 'Opera';           Exe = 'opera.exe';   Download = 'https://www.opera.com/download';\r\n               Paths = @('%LOCALAPPDATA%\\Programs\\Opera\\launcher.exe', '%ProgramFiles%\\Opera\\launcher.exe', '%ProgramFiles(x86)%\\Opera\\launcher.exe') }\r\n}\r\n\r\n$ToolShare = '\\\\172.32.2.12\\Ftp\\Utilities'\r\n$ToolCache = Join-Path $env:LOCALAPPDATA 'MTCNC\\Tools'\r\n$Tools = [ordered]@{\r\n  quickassist = @{ Name = 'Quick Assist'; Uri = 'ms-quick-assist:'; Store = 'ms-windows-store://pdp/?productid=9P7BP5VNWKX5' }\r\n  anydesk     = @{ Name = 'AnyDesk'; Signer = 'AnyDesk|philandro'; Portable = @('AnyDesk.exe'); Match = '^AnyDesk'; Exe = 'AnyDesk.exe';\r\n                   Installed = @('%ProgramFiles(x86)%\\AnyDesk\\AnyDesk.exe', '%ProgramFiles%\\AnyDesk\\AnyDesk.exe') }\r\n  ultraviewer = @{ Name = 'UltraViewer'; Signer = 'DucFabulous|UltraViewer'; Portable = @(); Setup = 'UltraViewer*setup*.exe'; Match = '^UltraViewer'; Exe = 'UltraViewer_Desktop.exe';\r\n                   Installed = @('%ProgramFiles(x86)%\\UltraViewer\\UltraViewer_Desktop.exe', '%ProgramFiles%\\UltraViewer\\UltraViewer_Desktop.exe') }\r\n  teamviewer  = @{ Name = 'TeamViewer QuickSupport'; Signer = 'TeamViewer'; Portable = @('TeamViewerQS.exe', 'TeamViewerQS_x64.exe'); Match = '^TeamViewer'; Exe = 'TeamViewer.exe';\r\n                   Installed = @('%ProgramFiles%\\TeamViewer\\TeamViewer.exe', '%ProgramFiles(x86)%\\TeamViewer\\TeamViewer.exe') }\r\n}\r\n\r\nfunction Show-Message([string]$Text, [string]$Buttons = 'OK', [string]$Icon = 'Information') {\r\n  Add-Type -AssemblyName System.Windows.Forms\r\n  return [System.Windows.Forms.MessageBox]::Show($Text, $Title, $Buttons, $Icon)\r\n}\r\n\r\nfunction Find-Browser($Browser) {\r\n  $keys = @(\r\n    \"HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\$($Browser.Exe)\",\r\n    \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\$($Browser.Exe)\",\r\n    \"HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\App Paths\\$($Browser.Exe)\"\r\n  )\r\n  foreach ($key in $keys) {\r\n    try {\r\n      $value = (Get-ItemProperty -LiteralPath $key -ErrorAction Stop).'(default)'\r\n      if ($value) { $value = $value.Trim().Trim('\"'); if (Test-Path -LiteralPath $value) { return $value } }\r\n    } catch { }\r\n  }\r\n  foreach ($path in $Browser.Paths) {\r\n    $full = [Environment]::ExpandEnvironmentVariables($path)\r\n    if (Test-Path -LiteralPath $full) { return $full }\r\n  }\r\n  return $null\r\n}\r\n\r\nfunction Read-Link([string]$Text) {\r\n  $result = @{}\r\n  if ($Text -notmatch '^mtcnc-(browser|tool):(//)?([a-zA-Z]+)') { return $result }\r\n  $result['_action'] = if ($Matches[1].ToLowerInvariant() -eq 'tool') { 'tool' } else { $Matches[3].ToLowerInvariant() }\r\n  $q = $Text.IndexOf('?')\r\n  if ($q -lt 0) { return $result }\r\n  foreach ($pair in $Text.Substring($q + 1).Split('&')) {\r\n    $kv = $pair.Split('=', 2)\r\n    if ($kv.Count -eq 2) { $result[$kv[0].ToLowerInvariant()] = [Uri]::UnescapeDataString($kv[1].Replace('+', ' ')) }\r\n  }\r\n  return $result\r\n}\r\n\r\nfunction Test-Signed([string]$Path, [string]$Signer) {\r\n  try {\r\n    $sig = Get-AuthenticodeSignature -LiteralPath $Path\r\n    return ($sig.Status -eq 'Valid' -and $sig.SignerCertificate -and $sig.SignerCertificate.Subject -match $Signer)\r\n  } catch { return $false }\r\n}\r\n\r\n# Finds an installed tool: known folders first, then the Windows \"installed apps\" list.\r\nfunction Find-InstalledTool($Tool) {\r\n  foreach ($path in $Tool.Installed) {\r\n    $full = [Environment]::ExpandEnvironmentVariables($path)\r\n    if (Test-Path -LiteralPath $full) { return $full }\r\n  }\r\n  if (-not $Tool.Match) { return $null }\r\n  $roots = @('HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*',\r\n             'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*',\r\n             'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*')\r\n  foreach ($root in $roots) {\r\n    $apps = @()\r\n    try { $apps = @(Get-ItemProperty -Path $root -ErrorAction Stop | Where-Object { $_.DisplayName -match $Tool.Match }) } catch { }\r\n    foreach ($app in $apps) {\r\n      $candidates = @()\r\n      if ($app.InstallLocation) { $candidates += (Join-Path ([string]$app.InstallLocation).Trim('\"') $Tool.Exe) }\r\n      if ($app.DisplayIcon) { $candidates += ([string]$app.DisplayIcon -replace ',\\s*-?\\d+$', '').Trim().Trim('\"') }\r\n      foreach ($c in $candidates) {\r\n        if ($c -and (Split-Path -Leaf $c) -ieq $Tool.Exe -and (Test-Path -LiteralPath $c)) { return $c }\r\n      }\r\n    }\r\n  }\r\n  return $null\r\n}\r\n\r\nfunction Start-Tool([string]$Key) {\r\n  $nl = [Environment]::NewLine\r\n  if (-not $Tools.Contains($Key)) { [void](Show-Message 'This link did not name a tool the launcher knows.' 'OK' 'Warning'); return 1 }\r\n  $tool = $Tools[$Key]\r\n  if ($tool.Uri) {\r\n    try { Start-Process $tool.Uri; return 0 } catch {\r\n      $answer = Show-Message (\"$($tool.Name) is not on this PC.\" + $nl + $nl + 'Open Microsoft Store to get it? No administrator password is needed.') 'YesNo' 'Question'\r\n      if ([string]$answer -eq 'Yes') { Start-Process $tool.Store }\r\n      return 2\r\n    }\r\n  }\r\n  $installed = Find-InstalledTool $tool\r\n  if ($installed) { Start-Process -FilePath $installed; return 0 }\r\n  foreach ($file in $tool.Portable) {\r\n    $local = Join-Path $ToolCache $file\r\n    $source = Join-Path $ToolShare $file\r\n    try {\r\n      if (Test-Path -LiteralPath $source) {\r\n        New-Item -ItemType Directory -Force -Path $ToolCache | Out-Null\r\n        Copy-Item -LiteralPath $source -Destination $local -Force\r\n      }\r\n    } catch { }\r\n    if (Test-Path -LiteralPath $local) {\r\n      if (Test-Signed $local $tool.Signer) { Start-Process -FilePath $local; return 0 }\r\n      Remove-Item -LiteralPath $local -Force -ErrorAction SilentlyContinue\r\n      [void](Show-Message (\"The copy of $($tool.Name) in the Utilities folder is not signed by its publisher, so it was not started.\" + $nl + 'Please tell IT.') 'OK' 'Warning')\r\n      return 3\r\n    }\r\n  }\r\n  if ($tool.Setup) {\r\n    $setup = $null\r\n    try { $setup = Get-ChildItem -LiteralPath $ToolShare -Filter $tool.Setup -File -ErrorAction Stop | Select-Object -First 1 } catch { }\r\n    if ($setup -and (Test-Signed $setup.FullName $tool.Signer)) {\r\n      $answer = Show-Message (\"$($tool.Name) is not installed on this PC and has no portable version.\" + $nl + $nl + 'Run its installer from the Utilities folder now? Windows will ask for an administrator to approve it.') 'YesNo' 'Question'\r\n      if ([string]$answer -eq 'Yes') { Start-Process -FilePath $setup.FullName }\r\n      return 2\r\n    }\r\n  }\r\n  $other = if ($Key -eq 'anydesk') { 'Use Quick Assist instead, or call IT.' } else { 'Use Quick Assist or AnyDesk instead, or call IT.' }\r\n  [void](Show-Message (\"$($tool.Name) is not installed on this PC and was not found in $ToolShare.\" + $nl + $nl + $other) 'OK' 'Information')\r\n  return 2\r\n}\r\n\r\n$p = Read-Link $Link\r\nif ($p['_action'] -eq 'tool') { exit (Start-Tool ([string]$p['t']).ToLowerInvariant()) }\r\n$key = ([string]$p['b']).ToLowerInvariant()\r\nif (-not $Browsers.Contains($key)) { [void](Show-Message 'This link did not name a browser the launcher knows.' 'OK' 'Warning'); exit 1 }\r\n$browser = $Browsers[$key]\r\n\r\n$uri = $null\r\nif (-not [Uri]::TryCreate([string]$p['u'], [UriKind]::Absolute, [ref]$uri) -or ($uri.Scheme -ne 'http' -and $uri.Scheme -ne 'https')) {\r\n  [void](Show-Message 'Only web addresses (http or https) can be opened.' 'OK' 'Warning'); exit 1\r\n}\r\n\r\n$exe = Find-Browser $browser\r\nif (-not $exe) {\r\n  $nl = [Environment]::NewLine\r\n  $answer = Show-Message (\"$($browser.Name) is not installed on this PC.\" + $nl + $nl + \"Open the $($browser.Name) download page now?\") 'YesNo' 'Question'\r\n  if ([string]$answer -eq 'Yes') { Start-Process $browser.Download }\r\n  exit 2\r\n}\r\n\r\n# AbsoluteUri is fully escaped (no spaces or quotes), so it is passed as one safe argument.\r\nStart-Process -FilePath $exe -ArgumentList ('\"' + $uri.AbsoluteUri + '\"')\r\nexit 0\r\n";
  function currentBrowser() {

      </div>`).join('');
    $('modalRoot').innerHTML = `<div class="modal-bg" data-close-bg><section class="modal" role="dialog" aria-modal="true" aria-labelledby="browserChoiceTitle">
    <div class="modal-head"><h2 id="browserChoiceTitle">Open ${esc(pendingBusinessApp.title)}</h2><button type="button" class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <div class="modal-body"><p style="margin:0 0 12px">Choose a browser. If it is not installed on this PC, you will be offered its download page.</p>

  function downloadRdpFile(endpoint, filename) {
    // Endpoints and filenames come only from the fixed RDP configuration above.
    if (!RDP.some((option) => option.local === endpoint || option.remote === endpoint) || !/^Option_[1-3]_(Local|Remote)\.rdp$/.test(filename)) {
      toast('This Remote Desktop connection is not available.', 'error');
      return;
    }
    const contents = [
      `full address:s:${endpoint}`,
      'prompt for credentials:i:1',
      'authentication level:i:2',
      'enablecredsspsupport:i:1',
      'screen mode id:i:2',
      ''
    ].join('\r\n');
    const fileUrl = URL.createObjectURL(new Blob([contents], { type: 'application/x-rdp' }));
    const link = document.createElement('a');
    link.href = fileUrl;
    link.download = filename;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(() => URL.revokeObjectURL(fileUrl), 60000);

  async function submitTicket(e) {
    e.preventDefault();
    const f = e.target; const body = Object.fromEntries(new FormData(f).entries());
    for (const k of Object.keys(body)) body[k] = String(body[k]).trim().replace(/\s+/g, ' ');
    const missing = [['requester_name', 'employee name'], ['emp_code', 'emp code'], ['from_dept', 'department'], ['contact_no', 'contact number'], ['issue_type', 'type of issue'], ['title', 'issue']].filter(([k]) => !body[k]).map(([, l]) => l);
    if (missing.length) { $('tErr').textContent = `Please fill in: ${missing.join(', ')}.`; const first = f.querySelector(':invalid, [required]:placeholder-shown'); if (first) first.focus(); return; }
    if (!/^[A-Za-z0-9\-\/]{1,20}$/.test(body.emp_code)) { $('tErr').textContent = 'Emp code can only contain letters, numbers, - and /.'; f.emp_code.focus(); return; }
    for (const k of ['contact_no', 'alt_contact']) if (body[k] && !/^[0-9+()\-\s]{3,20}$/.test(body[k])) { $('tErr').textContent = 'Phone numbers can only contain digits, spaces, +, ( ) and -.'; f[k].focus(); return; }
    if (body.remote_id && !/^[A-Za-z0-9@.\-\s]{1,40}$/.test(body.remote_id)) { $('tErr').textContent = 'The remote ID can only contain letters, numbers, spaces, @, . and -.'; f.remote_id.focus(); return; }
    if (body.remote_id && !body.remote_tool) body.remote_tool = 'Other';
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true; $('tErr').textContent = '';
    try {
      const r = await api('/api/helpdesk', 'POST', body);
      store.set('name', body.requester_name);
      store.set('ticketProfile', { requester_name: body.requester_name, emp_code: body.emp_code, from_dept: body.from_dept, contact_no: body.contact_no, alt_contact: body.alt_contact, computer_name: body.computer_name, remote_tool: body.remote_tool, remote_id: body.remote_id });
      store.set('myTickets', [...new Set([...store.get('myTickets', []), r.data.ticket_ref])].slice(-100));
      f.title.value = ''; f.detail.value = ''; f.issue_type.value = ''; f.priority.value = 'Normal';
      toast(`Ticket ${r.data.ticket_ref} sent to the IT Department. Keep this number to follow it up.`, 'ok');
      await load('tickets'); S.ui.ticketTab = 'All'; render(true);
    } catch (err) { $('tErr').textContent = err.message; } finally { btn.disabled = false; }
  }
  async function submitIdea(e) {
    e.preventDefault();
    const f = e.target; const body = Object.fromEntries(new FormData(f).entries());
    for (const k of Object.keys(body)) body[k] = String(body[k]).trim();
    if (!body.suggestion_text) { $('iErr').textContent = 'Please write your idea.'; return; }
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true; $('iErr').textContent = '';
    try {
      const r = await api('/api/suggestions', 'POST', body);
      store.set('myIdeas', [...new Set([...store.get('myIdeas', []), r.data.id])].slice(-100));
      f.suggestion_text.value = '';
      toast('Thank you! Your idea has been sent to plant management.', 'ok');
      await load('ideas'); render(true);
    } catch (err) { $('iErr').textContent = err.message; } finally { btn.disabled = false; }
  }

      const ownCategory = { hr: 'HR', marketing: 'Marketing', quality: 'Quality', canteen: 'Canteen' }[deptKey];

        { name: 'category', label: 'Department / category', type: 'select', options: isAdmin() ? NOTICE_CATS : [ownCategory], value: ownCategory || (DEPT_PAGES[S.route] && DEPT_PAGES[S.route].cats && !DEPT_PAGES[S.route].all ? DEPT_PAGES[S.route].cat : 'General') },
        { name: 'body', label: 'Full text', type: 'textarea', placeholder: 'Circular number, who it applies to, what to do... Paste a OneDrive or SharePoint link to attach a document.' },
        { name: 'attachment', label: 'Attachment', type: 'file', accept: ATTACH_ACCEPT, hint: 'PDF, Word, Excel, PowerPoint, JPG or PNG, up to 20 MB. Saved in the Circulars folder on the server.' }
      ];
      if (isAdmin()) fields.push({ name: 'is_pinned', label: 'Pin to the top of the board', type: 'checkbox' });
      openForm({ title: 'New notice / circular', submitLabel: 'Publish', fields, onSubmit: async (v) => {
        const file = v.attachment; delete v.attachment;
        if (file) {
          if (file.size > 20 * 1024 * 1024) throw new Error('The attachment is larger than 20 MB.');
          if (!new RegExp(`\\.(${ATTACH_EXT.join('|')})$`, 'i').test(file.name)) throw new Error('Attach a PDF, Word, Excel, PowerPoint, JPG or PNG file.');
          $('mOk').textContent = 'Uploading…';
          const up = await fetch('/api/announcements/attachment', { method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/octet-stream', 'X-File-Name': encodeURIComponent(file.name), 'X-Category': v.category || 'General' }, body: file });
          const r = await up.json().catch(() => ({}));
          if (!up.ok || !r.success) { $('mOk').textContent = 'Publish'; throw new Error(r.message || `The attachment could not be saved (HTTP ${up.status}).`); }
          v.attachment_path = r.data.path; v.attachment_name = r.data.name;
        }
        await api('/api/announcements', 'POST', v);
        await done(file ? 'Circular and attachment published.' : 'Circular published to every screen.', 'notices', ...(file ? ['circularDocuments'] : []));
      } });
    },
    'edit-notice': (el) => {
      const item = byId(S.notices, el.dataset.id);
      if (!item) return;
      openForm({ title: `Edit ${item.category || 'department'} circular`, submitLabel: 'Save changes', fields: [
        { name: 'headline', label: 'Headline', required: true, max: 160, value: item.headline },
        { name: 'body', label: 'Full text', type: 'textarea', value: item.body || '' }
      ], onSubmit: async (v) => { await api(`/api/announcements/${encodeURIComponent(item.id)}`, 'PUT', v); await done('Circular updated.', 'notices'); } });
    },
    'pin-notice': async (el) => { try { await api(`/api/announcements/${el.dataset.id}/pin`, 'PATCH', { is_pinned: el.dataset.pin === '1' }); await done(el.dataset.pin === '1' ? 'Pinned to the top.' : 'Unpinned.', 'notices'); } catch (e) { toast(e.message, 'error'); } },
    'del-notice': (el) => { const a = byId(S.notices, el.dataset.id); confirmBox(`Delete the notice "${a ? a.headline : ''}"?`, 'Delete', async () => { await api(`/api/announcements/${el.dataset.id}`, 'DELETE'); await done('Notice deleted.', 'notices', 'circularDocuments'); }); },
    'add-event': () => openForm({ title: 'New event', submitLabel: 'Add event', fields: [
        { name: 'title', label: 'Event', required: true, max: 120 },
        { name: 'event_date', label: 'Date', type: 'date', required: true, value: isoToday() },
        { name: 'place_and_time', label: 'Place and time', placeholder: 'Main Conference Hall, 10:00 AM', max: 120 }
      ], onSubmit: async (v) => { await api('/api/events', 'POST', v); await done('Event added.', 'events'); } }),
    'del-event': (el) => { const ev = byId(S.events, el.dataset.id); confirmBox(`Delete the event "${ev ? ev.title : ''}"?`, 'Delete', async () => { await api(`/api/events/${el.dataset.id}`, 'DELETE'); await done('Event deleted.', 'events'); }); },
    'add-link': () => openForm({ title: 'New business app link', submitLabel: 'Add link', fields: [
        { name: 'title', label: 'Name', required: true, max: 100 },
        { name: 'url', label: 'Web address', required: true, placeholder: 'https://...', max: 500 },
        { name: 'subtext', label: 'Short description', max: 200 },
        { name: 'group_name', label: 'Group', required: true, value: 'Other links', max: 60, hint: 'existing: ' + APP_GROUPS.map((g) => g.group).join(', ') }
      ], onSubmit: async (v) => { if (!/^https?:\/\//i.test(v.url)) throw new Error('The web address must start with http:// or https://'); v.sort_order = 1; await api('/api/links', 'POST', v); await done('Link added.', 'links'); } }),
    'del-link': (el) => confirmBox('Delete this link?', 'Delete', async () => { await api(`/api/links/${el.dataset.id}`, 'DELETE'); await done('Link deleted.', 'links'); }),
    'del-ticket': (el) => confirmBox('Delete this helpdesk request?', 'Delete', async () => { await api(`/api/helpdesk/${el.dataset.id}`, 'DELETE'); await done('Request deleted.', 'tickets'); }),
    'add-person': () => personForm(),
    'edit-person': (el) => personForm(byId(S.people, el.dataset.id)),
    'del-person': (el) => { const p = byId(S.people, el.dataset.id); confirmBox(`Remove ${p ? p.name : 'this person'} from the directory?`, 'Remove', async () => { await api(`/api/employees/${el.dataset.id}`, 'DELETE'); await done('Removed from the directory.', 'people', 'hr'); }); },
    'add-holiday': () => openForm({ title: 'New holiday', submitLabel: 'Add holiday', fields: [
        { name: 'name', label: 'Holiday', required: true, max: 100 },
        { name: 'holiday_date', label: 'Date', type: 'date', required: true }
      ], onSubmit: async (v) => { await api('/api/hr/holidays', 'POST', v); await done('Holiday added.', 'hr'); } }),
    'del-holiday': (el) => { const h = S.hr.holidays.find((x) => String(x.id) === el.dataset.id); confirmBox(`Delete the holiday "${h ? h.name : ''}"?`, 'Delete', async () => { await api(`/api/hr/holidays/${el.dataset.id}`, 'DELETE'); await done('Holiday deleted.', 'hr'); }); },
    'hr-doc-view': (el) => openPdfViewer(0, el.dataset.name, el.dataset.url),
    'add-hr-contact': () => hrContactForm(),
    'edit-hr-contact': (el) => hrContactForm(S.hr.contacts.find((p) => String(p.id) === el.dataset.id)),
    'del-hr-contact': (el) => { const p = S.hr.contacts.find((x) => String(x.id) === el.dataset.id); confirmBox(`Delete HR contact "${p ? p.name : ''}"?`, 'Delete', async () => { await api(`/api/hr/contacts/${el.dataset.id}`, 'DELETE'); await done('HR contact deleted.', 'hr'); }); },
    'del-idea': (el) => confirmBox('Delete this idea?', 'Delete', async () => { await api(`/api/suggestions/${el.dataset.id}`, 'DELETE'); await done('Idea deleted.', 'ideas'); }),
    'edit-asset': (el) => {
      const a = S.assets[Number(el.dataset.id)] || {};
      openForm({ title: `Assign ${a['Endpoint Name'] || 'machine'}`, submitLabel: 'Save', fields: [
          { name: 'User Id', label: 'User Id', value: a['User Id'], max: 100 },
          { name: 'Name', label: 'Name', value: a.Name, max: 120 }
        ], onSubmit: async (v) => { await api(`/api/assets/${el.dataset.id}/assignment`, 'PATCH', v); await done('Assignment saved.', 'assets'); } });
    }
  };
  function hrContactForm(p) {
    if (!isAdmin()) return;
    openForm({ title: p ? `Edit ${p.name}` : 'Add HR & Safety Contact', submitLabel: p ? 'Save changes' : 'Create contact', fields: [
      { name: 'name', label: 'Name', required: true, value: p && p.name, max: 120 },
      { name: 'department', label: 'Department / role', value: p && p.department, max: 80 },
      { name: 'phone_ext', label: 'Phone / extension', value: p && p.phone_ext, max: 100 },
      { name: 'email', label: 'E-mail', type: 'text', value: p && p.email, max: 120, hint: 'Separate multiple addresses with a comma or semicolon.' }
    ], onSubmit: async (v) => {
      if (p) await api(`/api/hr/contacts/${p.id}`, 'PUT', v);
      else await api('/api/hr/contacts', 'POST', v);
      await done(p ? 'HR contact updated.' : 'HR contact created.', 'hr');
    } });
  }
  function intercomForm(item) {
    if (!isAdmin()) return;
    openForm({ title: item ? 'Edit Inter-Com entry' : 'Add Inter-Com entry', submitLabel: item ? 'Save changes' : 'Add entry', fields: [
      { name: 'department', label: 'Department', required: true, value: item && item.Department, max: 120 },
      { name: 'name', label: 'Name', value: item && item.Name, max: 180 },
      { name: 'extension', label: 'Tel.No', type: 'text', required: true, value: item && item['Tel.No'], max: 10, hint: 'Enter digits only.' }
    ], onSubmit: async (v) => {
      if (!/^\d{1,10}$/.test(v.extension)) throw new Error('Telephone extension must contain 1 to 10 digits.');
      if (item) await api(`/api/intercom-details/${item.id}`, 'PUT', v);
      else await api('/api/intercom-details', 'POST', v);
      await done(item ? 'Inter-Com entry updated.' : 'Inter-Com entry added.', 'intercomDetails');
    } });
  }
  function personForm(p) {
    openForm({ title: p ? `Edit ${p.name}` : 'New person', submitLabel: 'Save', fields: [
        ...(p ? [] : [{ name: 'emp_id', label: 'Employee ID', required: true, max: 120 }]),
        { name: 'name', label: 'Name', required: true, value: p && p.name, max: 120 },
        { name: 'designation', label: 'Designation', required: true, value: p && p.designation, max: 100 },
        { name: 'department', label: 'Department', required: true, value: p && p.department, max: 80 },
        { name: 'phone_ext', label: 'Extension', required: true, value: p && p.phone_ext, max: 20 },
        { name: 'email', label: 'E-mail', type: 'email', value: p && p.email, max: 120 },
        { name: 'shift', label: 'Shift', type: 'select', options: EMP_SHIFTS, value: (p && p.shift) || 'General' }
      ], onSubmit: async (v) => {
        if (p) await api(`/api/employees/${p.id}`, 'PUT', v); else await api('/api/employees', 'POST', v);
        await done('Directory updated.', 'people', 'hr');
      } });
  }
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT') return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });

  /* ---------- Global search ---------- */
  let hits = [], hitIx = 0;
  function searchIndex(q) {
    q = q.toLowerCase();
    const m = (s) => String(s || '').toLowerCase().includes(q);
    const out = [];
    const add = (group, list) => { if (list.length) out.push({ group, list: list.slice(0, 6) }); };
    add('People', S.people.filter((p) => m(p.name) || m(p.phone_ext) || m(p.email) || m(p.department)).map((p) => ({ t: p.name, s: [p.department, p.phone_ext && 'Ext ' + p.phone_ext, p.email].filter(Boolean).join(' · '), go: ['directory', { peopleQ: p.name, dept: 'All' }] })));
    add('SOPs & documents', S.docs.filter((d) => m(d.name)).map((d) => ({ t: d.name, s: 'PDF document', go: ['documents', { docQ: d.name }] })));
    add('Notices', S.notices.filter((a) => m(a.headline) || m(a.body)).map((a) => ({ t: a.headline, s: `${a.category} · ${fmtDate(a.posted_date)}`, go: [pageForCategory(a.category), { noticeQ: a.headline, noticeCat: 'All' }] })));
    add('Apps', allApps().flatMap((g) => g.items).filter((i) => m(i[0]) || m(i[1]) || m(i[2])).map((i) => ({ t: i[0], s: i[2], url: i[2] })));
    add('Events & holidays', [...S.events.filter((ev) => m(ev.title)).map((ev) => ({ t: ev.title, s: fmtDate(ev.event_date), go: ['notices', {}] })),
      ...S.hr.holidays.filter((h) => m(h.name)).map((h) => ({ t: h.name, s: `Holiday · ${fmtDate(h.holiday_date)}`, go: ['hr', {}] }))]);
    const pages = Object.entries(TITLES).filter(([k, v]) => (k !== 'assets' || isAdmin()) && m(v)).map(([k, v]) => ({ t: v, s: 'Open page', go: [k, {}] }));
    add('Pages', pages);
    return out;
  }
  function showResults() {
    const q = $('q').value.trim();
    const box = $('qResults');
    if (q.length < 2) { box.hidden = true; return; }
    const groups = searchIndex(q);
    hits = groups.flatMap((g) => g.list); hitIx = 0;
    let i = 0;
    box.innerHTML = groups.length ? groups.map((g) => `<div class="sr-group">${esc(g.group)}</div>${g.list.map((h) => `<button type="button" class="sr-item${i === 0 ? ' active' : ''}" data-hit="${i++}"><span><b>${esc(h.t)}</b><small>${esc(h.s || '')}</small></span></button>`).join('')}`).join('')
            : `<div class="sr-empty">Nothing found for "${esc(q)}". Try a name, extension, SOP number or app.</div>`;
    box.hidden = false;
  }
  function openHit(h) {
    if (!h) return;
    $('q').value = ''; $('qResults').hidden = true;
    if (h.url) { window.open(safeUrl(h.url), '_blank', 'noopener'); return; }
    go(h.go[0], h.go[1]);
  }
  $('q').addEventListener('input', showResults);
  $('q').addEventListener('keydown', (e) => {
    const items = [...$('qResults').querySelectorAll('.sr-item')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!items.length) return;
      hitIx = (hitIx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((el, ix) => el.classList.toggle('active', ix === hitIx)); items[hitIx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); openHit(hits[hitIx]); }
    else if (e.key === 'Escape') { $('qResults').hidden = true; $('q').blur(); }
  });
  $('qResults').addEventListener('click', (e) => { const b = e.target.closest('[data-hit]'); if (b) openHit(hits[Number(b.dataset.hit)]); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('qResults').hidden = true; });
  document.addEventListener('keydown', (e) => {
    if (activePdf && (e.ctrlKey || e.metaKey) && ['p', 's'].includes(e.key.toLowerCase())) {
      e.preventDefault(); e.stopImmediatePropagation();
      toast(e.key.toLowerCase() === 'p' ? 'Printing is disabled in the document viewer.' : 'Saving from the document viewer is disabled.', 'error');
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); $('q').select(); }
    if (e.key === 'Escape' && $('modalRoot').innerHTML) closeModal();
  }, true);
  document.addEventListener('contextmenu', (e) => { if (activePdf && e.target.closest('#pdfOverlay')) e.preventDefault(); });

  /* ---------- Start ---------- */
  $('sosList').innerHTML = SOS.map(([n, v]) => `<li><span>${esc(n)}</span><b>${esc(v)}</b></li>`).join('');
  $('menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  document.addEventListener('click', (e) => { if (document.body.classList.contains('nav-open') && !e.target.closest('.side') && !e.target.closest('#menuBtn')) document.body.classList.remove('nav-open'); });
  $('themeBtn').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  $('adminBtn').addEventListener('click', adminLogin);
  $('logoutBtn').addEventListener('click', adminLogout);
  setTheme(store.get('theme', window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  tickClock(); setInterval(tickClock, 20000);
  setInterval(() => { if (S.route === 'today' && !$('modalRoot').innerHTML) V.today.fill(); }, 60000);
  setInterval(() => { if (S.route === 'today' && !document.hidden) loadBio(true); }, 30000);

  (async function start() {
    $('view').innerHTML = '<p class="empty">Loading the plant intranet…</p>';
    try {
      await ensureSession();
      await loadAll();
      connectSocket();
      render();
    } catch (err) {
      $('view').innerHTML = `<section class="card card-pad"><h2>The intranet could not load</h2><p>${esc(err.message)}</p><button class="btn btn-primary" onclick="location.reload()">Try again</button></section>`;
    }
  })();
</script>
</body>
</html>
