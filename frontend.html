<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MT CNC-Group plant intranet: notices, SOPs, business apps, helpdesk, directory and HR.">
  <title>MT CNC-Group Intranet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e08a12'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial' font-size='28' font-weight='800' text-anchor='middle' fill='%231b1203'%3EMT%3C/text%3E%3C/svg%3E">
  <style>
    /* =====================================================================
       MT CNC-Group Plant Hub  -  design system
       Steel navy + safety amber, large readable type, light and dark.
       ===================================================================== */
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-2: #f6f8fb;
      --ink: #0f1b2a;
      --muted: #3d4b5c;
      --soft: #5d6b7c;
      --line: #cfd8e3;
      --line-2: #e3e9f0;
      --brand: #1d4f7a;
      --brand-ink: #ffffff;
      --brand-soft: #e3edf6;
      --amber: #e08a12;
      --amber-soft: #fdf1de;
      --amber-ink: #8a4f00;
      --ok: #1d7a46;
      --ok-soft: #e1f3e8;
      --crit: #b42318;
      --crit-soft: #fde7e5;
      --info: #1f5fbf;
      --info-soft: #e4edfb;
      --violet: #6a3fb5;
      --violet-soft: #efe8fb;
      --side: #10263d;
      --side-2: #163452;
      --side-ink: #e8eff7;
      --side-muted: #a9bccf;
      --shadow: 0 1px 2px rgba(15, 27, 42, .06), 0 4px 14px rgba(15, 27, 42, .06);
      --radius: 14px;
      --font: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0b141e;
      --surface: #121e2c;
      --surface-2: #172536;
      --ink: #eef3f8;
      --muted: #c3cfdb;
      --soft: #9fb0c2;
      --line: #2a3b4f;
      --line-2: #213245;
      --brand: #5aa2e0;
      --brand-ink: #071421;
      --brand-soft: #16324d;
      --amber: #f3a63b;
      --amber-soft: #3a2a12;
      --amber-ink: #f7c37a;
      --ok: #5fd08f;
      --ok-soft: #12321f;
      --crit: #ff8a80;
      --crit-soft: #3b1715;
      --info: #84b4f5;
      --info-soft: #172b48;
      --violet: #c2a4f5;
      --violet-soft: #2b2145;
      --side: #08111b;
      --side-2: #10202f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 13.5px/1.55 var(--font);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--brand); }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -.01em; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    svg.i { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Shell ---------- */
    .shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
    .side {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      background: linear-gradient(180deg, var(--side) 0%, var(--side-2) 100%);
      color: var(--side-ink); display: flex; flex-direction: column; padding: 20px 14px 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; color: inherit; text-decoration: none; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: var(--amber); color: #1b1203; font-weight: 800; font-size: 13.5px; letter-spacing: .02em;
    }
    .brand b { display: block; font-size: 14.5px; line-height: 1.2; }
    .brand-copy { display: block; }
    .brand small { display: block; color: var(--side-muted); font-size: 11px; font-weight: 600; }
    .nav-group { margin: 6px 0 10px; }
    .nav-title { padding: 8px 12px 6px; color: var(--side-muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; margin: 2px 0;
      border-radius: 10px; color: var(--side-ink); text-decoration: none; font-weight: 600; font-size: 13px;
    }
    .nav-link:hover { background: rgba(255, 255, 255, .08); }
    .nav-link[aria-current="page"] { background: #ffffff; color: #10263d; }
    .nav-link[aria-current="page"] svg { color: var(--amber); }
    .nav-count { margin-left: auto; min-width: 26px; padding: 1px 8px; border-radius: 999px; background: var(--amber); color: #1b1203; font-size: 11px; font-weight: 800; text-align: center; }
    .sos { margin-top: auto; padding: 14px; border-radius: 12px; background: rgba(180, 35, 24, .22); border: 1px solid rgba(255, 138, 128, .35); }
    .sos h3 { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #ffb4ac; margin-bottom: 8px; }
    .sos ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; }
    .sos li { display: contents; }
    .sos li span { color: var(--side-muted); }
    .sos li b { color: #fff; text-align: right; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
      padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    }
    .top .menu-btn { display: none; }
    .search { position: relative; flex: 1; max-width: 640px; }
    .search input {
      width: 100%; height: 48px; padding: 0 76px 0 46px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--surface); font-size: 13px;
    }
    .search > svg { position: absolute; left: 14px; top: 14px; color: var(--soft); }
    .search kbd { position: absolute; right: 12px; top: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; font: 600 11px var(--font); color: var(--soft); background: var(--surface-2); }
    .search-results {
      position: absolute; left: 0; right: 0; top: 54px; max-height: 70vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
    }
    .sr-group { padding: 8px 10px 4px; color: var(--soft); font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .sr-item { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px; border: 0; border-radius: 9px; background: none; text-align: left; cursor: pointer; }
    .sr-item:hover, .sr-item.active { background: var(--brand-soft); }
    .sr-item b { display: block; font-size: 13px; }
    .sr-item small { display: block; color: var(--soft); font-size: 11px; }
    .sr-empty { padding: 16px; color: var(--soft); }
    .top-meta { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .clock { text-align: right; line-height: 1.25; }
    .clock b { display: block; font-size: 14.5px; }
    .clock small { color: var(--soft); font-size: 11px; font-weight: 600; }
    .icon-btn {
      width: 44px; height: 44px; display: grid; place-items: center; border-radius: 11px;
      border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    }
    .who { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border-radius: 12px; }
    .who .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 12px; }
    .who b { display: block; font-size: 12px; line-height: 1.2; }
    .who small { color: var(--soft); font-size: 11px; font-weight: 600; }
    .who small a { color: inherit; text-decoration: none; font-weight: 700; }
    .who small a:hover { text-decoration: underline; }

    .content { padding: 26px 28px 60px; max-width: 1480px; width: 100%; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .page-head h1 { font-size: 25.5px; }
    .page-head p { margin: 6px 0 0; color: var(--muted); max-width: 760px; }
    .crumb { color: var(--soft); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }

    /* ---------- Building blocks ---------- */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-pad { padding: 20px 22px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line-2); }
    .card-head h2 { font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .card-head h2 svg { color: var(--brand); }
    .canteen-card { overflow: hidden; border-color: color-mix(in srgb, var(--brand) 42%, var(--line)); background: linear-gradient(125deg, var(--surface) 0%, color-mix(in srgb, var(--brand) 11%, var(--surface)) 100%); }
    .canteen-slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 16px; }
    .canteen-slot { display: flex; align-items: center; gap: 14px; min-height: 86px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface) 82%, transparent); }
    .canteen-slot .canteen-icon { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; color: var(--brand); background: color-mix(in srgb, var(--brand) 16%, var(--surface)); border-radius: 12px; }
    .canteen-slot .canteen-icon svg { width: 21px; height: 21px; }
    .canteen-slot small { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .canteen-slot strong { display: inline-block; margin-right: 12px; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
    .more { color: var(--brand); font-weight: 700; text-decoration: none; font-size: 12px; white-space: nowrap; }
    .more:hover { text-decoration: underline; }
    .grid { display: grid; gap: 18px; }
    .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .g-main { grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); }
    .stack { display: grid; gap: 18px; align-content: start; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
      padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
      font-weight: 700; font-size: 12.5px; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap;
    }
    .btn:hover { border-color: var(--brand); }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-amber { background: var(--amber); border-color: var(--amber); color: #1b1203; }
    .btn-dept-login {
      min-height: 42px; padding: 0 17px; border-radius: 11px; border-color: rgba(91, 190, 255, .48);
      background: linear-gradient(135deg, #087fc4, #16a5dc); color: #fff;
      box-shadow: 0 5px 16px rgba(0, 135, 210, .22); transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    .btn-dept-login .i { width: 17px; height: 17px; color: #d8f4ff; }
    .btn-dept-login:hover { border-color: #9cddff; box-shadow: 0 7px 20px rgba(0, 153, 225, .32); filter: brightness(1.08); transform: translateY(-1px); }
    .btn-dept-login:active { transform: translateY(0); }
    .btn-dept-login:focus-visible { outline: 3px solid rgba(98, 203, 255, .48); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .btn-dept-login { transition: none; } .btn-dept-login:hover { transform: none; } }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-danger { color: var(--crit); }
    .btn-danger:hover { border-color: var(--crit); }
    .btn-sm { min-height: 36px; padding: 0 12px; font-size: 11.5px; border-radius: 8px; }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: inline-flex !important; }
    body.is-admin .admin-only.block { display: block !important; }
    body.is-admin .admin-only.grid-on { display: grid !important; }
    .admin-col { display: none; }
    body.is-admin .admin-col { display: table-cell; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
    .chip .n { font-weight: 800; opacity: .7; }
    .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; background: var(--brand-soft); color: var(--brand); }
    .t-Safety, .t-Urgent, .t-safety { background: var(--crit-soft); color: var(--crit); }
    .t-Production { background: var(--info-soft); color: var(--info); }
    .t-Maintenance, .t-Important { background: var(--amber-soft); color: var(--amber-ink); }
    .t-Quality { background: var(--violet-soft); color: var(--violet); }
    .t-HR { background: var(--ok-soft); color: var(--ok); }
    .t-Pinned { background: var(--ink); color: var(--surface); }
    .t-Open { background: var(--amber-soft); color: var(--amber-ink); }
    .t-In-progress { background: var(--info-soft); color: var(--info); }
    .t-Done { background: var(--ok-soft); color: var(--ok); }
    .t-unannounced { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    .field-inline { position: relative; flex: 1 1 280px; max-width: 460px; }
    .field-inline svg { position: absolute; left: 13px; top: 13px; color: var(--soft); }
    .input, .select, .textarea {
      width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface); font-size: 13px;
    }
    .field-inline .input { padding-left: 42px; }
    .textarea { min-height: 120px; resize: vertical; }
    .select { padding-right: 34px; }
    .input::placeholder, .textarea::placeholder { color: var(--soft); opacity: 1; }
    .count-note { color: var(--soft); font-weight: 600; font-size: 12px; margin-left: auto; }
    .form { display: grid; gap: 14px; }
    .form-row { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form label { display: grid; gap: 6px; font-weight: 700; font-size: 12px; }
    .form label small { font-weight: 500; color: var(--soft); }
    .empty { padding: 28px 20px; text-align: center; color: var(--soft); }

    /* ---------- Today ---------- */
    .hero {
      position: relative; overflow: hidden; border-radius: 18px; padding: 26px 28px; color: #fff;
      background: radial-gradient(1000px 300px at 85% -10%, rgba(224, 138, 18, .35), transparent 60%),
      linear-gradient(120deg, #10263d 0%, #1d4f7a 100%);
      display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 26px; align-items: center;
    }
    .hero::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .14;
      background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
      background-size: 34px 34px; mask-image: linear-gradient(90deg, transparent 30%, #000);
    }
    .hero h1 { font-size: 27px; }
    .hero p { margin: 8px 0 0; color: #d7e4f1; font-size: 13.5px; }
    .hero-shift { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); font-weight: 700; font-size: 12px; }
    .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #5fd08f; box-shadow: 0 0 0 4px rgba(95,208,143,.25); }
    .safety { position: relative; z-index: 1; padding: 18px 20px; border-radius: 14px; background: rgba(5, 18, 31, .45); border: 1px solid rgba(255,255,255,.18); }
    .safety small { color: #ffd59a; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; font-size: 11px; }
    .safety .big { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 10px; }
    .safety .big b { font-size: 46.5px; line-height: 1; font-weight: 800; }
    .safety .big span { font-size: 14.5px; color: #d7e4f1; font-weight: 600; }
    .bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
    .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5fd08f, #e8f86a); }
    .safety p { margin: 8px 0 0; font-size: 11.5px; color: #c8d8e8; }

    .kpi { padding: 18px 20px; display: grid; gap: 6px; border-top: 5px solid var(--brand); }
    .kpi small { color: var(--muted); font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .kpi b { font-size: 27px; line-height: 1.1; font-weight: 800; }
    .kpi span { color: var(--muted); font-size: 12px; }
    .kpi a { font-weight: 700; font-size: 12px; text-decoration: none; }
    .kpi.k-ok { border-top-color: var(--ok); } .kpi.k-amber { border-top-color: var(--amber); } .kpi.k-info { border-top-color: var(--info); } .kpi.k-violet { border-top-color: var(--violet); }

    .notice { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--line-2); }
    .notice:last-child { border-bottom: 0; }
    .notice .rail { border-radius: 6px; background: var(--brand); }
    .notice.c-Safety .rail { background: var(--crit); } .notice.c-Production .rail { background: var(--info); }
    .notice.c-Maintenance .rail { background: var(--amber); } .notice.c-Quality .rail { background: var(--violet); } .notice.c-HR .rail { background: var(--ok); }
    .notice-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--soft); font-size: 11.5px; font-weight: 600; }
    .notice h3 { font-size: 15px; margin: 6px 0 4px; }
    .new-badge { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; flex: 0 0 52px; width: 52px; height: 25px; margin-left: 8px; color: #fff; background: #ed1c24; clip-path: polygon(50% 0%, 58% 18%, 73% 4%, 70% 25%, 92% 16%, 82% 36%, 100% 47%, 82% 57%, 93% 80%, 70% 73%, 74% 100%, 57% 83%, 50% 100%, 42% 83%, 25% 100%, 29% 73%, 7% 80%, 18% 57%, 0% 47%, 18% 36%, 8% 16%, 30% 25%, 27% 4%, 43% 18%); font-size: 9px; line-height: 1; letter-spacing: .04em; font-weight: 900; animation: circularNewBlink 1.4s ease-in-out infinite; }
    @keyframes circularNewBlink { 0%, 100% { opacity: 1; } 50% { opacity: .68; } }
    .doc-item.is-new-circular { background: rgba(224, 138, 18, .055); box-shadow: inset 3px 0 0 #f5a623; }
    .doc-item.is-new-circular:hover { background: rgba(224, 138, 18, .10); }
    .notice p { margin: 0; color: var(--muted); white-space: pre-line; }
    .row-actions { display: flex; gap: 6px; margin-top: 10px; }

    .event { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 22px; border-bottom: 1px solid var(--line-2); }
    .event:last-child { border-bottom: 0; }
    .date-box { border-radius: 12px; border: 1px solid var(--line); text-align: center; padding: 6px 0; background: var(--surface-2); }
    .date-box b { display: block; font-size: 19px; line-height: 1.1; }
    .date-box small { color: var(--amber-ink); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .event h3 { font-size: 13.5px; }
    .event p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .event.past { opacity: .55; }

    .shifts { display: grid; gap: 8px; padding: 14px 22px 18px; }
    .shift { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); font-weight: 700; }
    .shift.on { border: 2px solid var(--ok); background: var(--ok-soft); }
    .shift.on em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: var(--ok); color: #fff; margin-left: 8px; }

    .actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .action {
      display: grid; gap: 8px; padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
      text-decoration: none; color: var(--ink); box-shadow: var(--shadow); cursor: pointer; text-align: left;
    }
    .action:hover { border-color: var(--brand); transform: translateY(-1px); }
    .action .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
    .action.a-crit .ic { background: var(--crit-soft); color: var(--crit); }
    .action.a-amber .ic { background: var(--amber-soft); color: var(--amber-ink); }
    .action.a-ok .ic { background: var(--ok-soft); color: var(--ok); }
    .action.a-violet .ic { background: var(--violet-soft); color: var(--violet); }
    .action b { font-size: 13.5px; }
    .action span { color: var(--muted); font-size: 11.5px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 12px; }
    .section-title h2 { font-size: 17.5px; }

    /* ---------- Apps ---------- */
    .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .app-row-start { grid-column-start: 1; }
    .app {
      position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: center; padding: 16px;
      border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
    }
    .app:hover { border-color: var(--brand); }
    .app .logo { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: var(--brand); }
    .app b { display: block; font-size: 13px; line-height: 1.3; }
    .app small { display: block; color: var(--soft); font-size: 11px; overflow-wrap: anywhere; }
    .app .ext { position: absolute; right: 12px; top: 12px; color: var(--soft); }
    .app-del { position: absolute; right: 8px; bottom: 8px; }
    .group-h { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .rdp { padding: 18px; }
    .rdp h3 { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; margin-bottom: 10px; }
    .ep { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
    .ep small { display: block; color: var(--soft); font-size: 11px; font-weight: 700; }
    .ep code { font: 600 13px var(--font); overflow-wrap: anywhere; }
    .warn-note { margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: var(--amber-soft); color: var(--amber-ink); font-size: 11.5px; font-weight: 600; }

    /* ---------- Tables ---------- */
    .table-wrap { overflow-x: auto; }
    table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .t th { position: sticky; top: 0; text-align: left; padding: 12px 14px; background: var(--surface-2); color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .t td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
    .t tr:hover td { background: var(--surface-2); }
    .docno { font-weight: 800; color: var(--brand); white-space: nowrap; }
    .path { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .path code { font: 11.5px var(--font); color: var(--muted); overflow-wrap: anywhere; }

    .employee-details-tools { display: grid; grid-template-columns: minmax(200px, 1.5fr) repeat(5, minmax(100px, 1fr)) auto; gap: 10px; align-items: end; margin-bottom: 14px; }
    .employee-details-tools label { display: grid; gap: 6px; min-width: 0; color: var(--muted); font-size: 11px; font-weight: 700; }
    .employee-details-tools .field-inline { max-width: none; min-width: 0; }
    .employee-details-tools .count-note { grid-column: 1 / -1; margin: 0; }
    .employee-details-wrap { max-height: min(68vh, 760px); min-height: 260px; overflow: auto; border-radius: 12px; }
    .employee-details-table { width: max-content !important; min-width: 100%; }
    .employee-details-table th { position: sticky; top: 0; z-index: 3; }
    .employee-details-pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .intercom-details-table { width: 100% !important; min-width: 0 !important; table-layout: fixed; }
    .intercom-details-table th { position: sticky; top: 0; z-index: 3; padding: 9px 10px; }
    .intercom-details-table td { padding: 8px 10px; overflow-wrap: anywhere; }
    .intercom-details-table th:nth-child(1), .intercom-details-table td:nth-child(1) { width: 52px; }
    .intercom-details-table th:nth-child(2), .intercom-details-table td:nth-child(2) { width: 24%; }
    .intercom-details-table th:nth-child(3), .intercom-details-table td:nth-child(3) { width: 36%; }
    .intercom-details-table th:nth-child(4), .intercom-details-table td:nth-child(4) { width: 76px; white-space: nowrap; }
    .intercom-actions-cell { display: none; white-space: nowrap; }
    body.is-admin .intercom-actions-cell { display: table-cell; }
    .intercom-actions { display: flex; gap: 6px; align-items: center; }
    .intercom-actions .btn { padding: 6px 8px; }
    @media (max-width: 1100px) { .employee-details-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } .employee-details-tools .field-inline { grid-column: 1 / -1; } }
    @media (max-width: 640px) { .employee-details-tools { grid-template-columns: 1fr; } .employee-details-tools .field-inline { grid-column: auto; } }

    /* ---------- People ---------- */
    .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .person { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 16px; }
    .person .av { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--brand); font-size: 13.5px; }
    .person h3 { font-size: 14px; }
    .person .dept { color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
    .person .lines { display: grid; gap: 5px; margin-top: 8px; font-size: 12px; }
    .person .contact-line { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; margin-left: -66px; width: calc(100% + 66px); min-width: 0; }
    .person .contact-line > span { flex: 0 0 auto; white-space: nowrap; }
    .person .lines a { display: inline-flex; flex: 1 1 auto; gap: 8px; align-items: center; text-decoration: none; font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap; }
    .person .lines a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .person .lines a svg { flex: 0 0 auto; }
    .person .lines span { display: flex; gap: 8px; align-items: center; color: var(--muted); }
    .person .lines svg { width: 17px; height: 17px; color: var(--soft); }

    /* ---------- Helpdesk / ideas ---------- */
    .ticket { padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
    .ticket:last-child { border-bottom: 0; }
    .ticket-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--soft); font-size: 11.5px; font-weight: 600; }
    .ticket h3 { font-size: 14.5px; margin: 6px 0 2px; }
    .ticket p { margin: 4px 0 0; color: var(--muted); white-space: pre-line; }
    .ref { font-weight: 800; color: var(--ink); }
    .tabs { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; align-items: center; }
    .check { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; margin-left: auto; }
    .check input { width: 20px; height: 20px; }

    /* ---------- HR ---------- */
    .next-hol { display: flex; gap: 18px; align-items: center; padding: 22px; border-radius: var(--radius); background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); }
    .next-hol .date-box { width: 86px; background: var(--surface); }
    .next-hol .date-box b { font-size: 25.5px; }
    .next-hol h2 { font-size: 19px; }
    .next-hol p { margin: 4px 0 0; color: var(--muted); }
    .hol { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line-2); }
    .hol:last-child { border-bottom: 0; }
    .hol .date-box { width: 58px; }
    .hol .date-box b { font-size: 16px; }
    .hol b.n { font-size: 13.5px; }
    .hol small { display: block; color: var(--soft); font-size: 11.5px; }
    .hol > div:first-child { flex: 1; min-width: 110px; }
    .hol .holiday-status { flex: 0 0 auto; }
    .hol .del { margin-left: auto; }
    .hol.past { opacity: .5; }
    .doc-line { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line-2); }
    .doc-line:last-child { border-bottom: 0; }
    .doc-line b { display: block; }
    .doc-line small { color: var(--soft); font-size: 11px; overflow-wrap: anywhere; }
    .hr-contact-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .hr-contact-info { display: grid; gap: 4px; min-width: 0; }
    .hr-contact-info a { color: var(--brand); overflow-wrap: anywhere; }
    .hr-contact-info .hr-contact-meta { color: var(--soft); font-size: 11px; }
    .hr-contact-line .row-actions { flex: 0 0 auto; align-items: center; margin: 0; }

    /* ---------- Assets ---------- */
    .status-dot { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .status-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--soft); }
    .status-dot.on::before { background: var(--ok); }
    .status-dot.off::before { background: var(--crit); }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }

    /* ---------- Modal / toast ---------- */
    .modal-bg { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(6, 14, 24, .62); }
    .modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line-2); }
    .modal-head h2 { font-size: 17px; }
    .modal-body { padding: 20px 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px 20px; }
    .pdf-viewer-overlay { position: fixed; inset: 0; z-index: 75; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 14px; background: var(--bg); }
    .pdf-viewer-toolbar { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .pdf-viewer-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 750; }
    .pdf-name { display: flex; align-items: flex-start; gap: 9px; overflow-wrap: anywhere; white-space: pre-wrap; font-weight: 700; }
    .pdf-name svg { flex: 0 0 18px; color: var(--brand); }
    .pdf-viewer-frame-wrap { min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #263548; }
    .pdf-canvas-host { display: grid; justify-items: center; align-content: start; gap: 14px; min-height: 100%; padding: 18px; }
    .pdf-page-shell { display: grid; place-items: center; position: relative; flex: 0 0 auto; max-width: none; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .pdf-page-placeholder { display: grid; place-items: center; width: 100%; height: 100%; color: #617184; background: #fff; font-size: 12px; }
    .pdf-canvas { display: block; height: auto; background: #fff; user-select: none; -webkit-user-select: none; }
    .circular-image-preview { display: block; width: auto; height: auto; max-width: min(100%, 1500px); max-height: calc(100vh - 150px); object-fit: contain; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .pdf-viewer-status { color: #fff; padding: 18px; text-align: center; }
    .pdf-page-indicator { white-space: nowrap; color: var(--muted); font-size: 12px; font-weight: 700; }
    .browser-options { display: grid; gap: 10px; }
    .browser-option { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); text-align: left; cursor: pointer; transition: border-color .18s, transform .18s, background .18s; }
    .browser-option:hover, .browser-option:focus-visible { border-color: var(--brand); transform: translateY(-1px); outline: none; }
    .browser-option b { display: block; }
    .browser-option small { display: block; margin-top: 2px; color: var(--muted); }
    .browser-mark { display: grid; flex: 0 0 38px; width: 38px; height: 38px; place-items: center; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 850; }
    .browser-note { margin: 14px 0 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 640px) { .pdf-viewer-overlay { padding: 6px; gap: 6px; } .pdf-viewer-toolbar { gap: 5px; padding: 7px; flex-wrap: wrap; } .pdf-viewer-title { flex-basis: 100%; } .pdf-viewer-toolbar .btn { padding: 0 9px; } }
    .lock-note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--brand-soft); color: var(--ink); font-size: 12px; margin-bottom: 14px; }
    .lock-note svg { color: var(--brand); }
    .err { color: var(--crit); font-weight: 700; font-size: 12px; min-height: 1.2em; margin: 0; }
    .toasts { position: fixed; right: 18px; bottom: 18px; z-index: 80; display: grid; gap: 10px; }
    .toast { min-width: 280px; max-width: 420px; padding: 14px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow); font-weight: 600; border-left: 6px solid var(--brand); }
    .toast.ok { border-left-color: #5fd08f; } .toast.error { border-left-color: #ff8a80; }
    .banner { display: flex; gap: 10px; align-items: center; margin: 0 28px; margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: var(--amber-soft); color: var(--amber-ink); font-weight: 700; }
    .foot { margin-top: auto; padding: 18px 28px; color: var(--soft); font-size: 11px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1280px) {
      .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 1100px) {
      .g-main, .hero, .g-3 { grid-template-columns: 1fr; }
      .clock { display: none; }
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: fixed; z-index: 50; left: 0; top: 0; width: 290px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.4); }
      body.nav-open .side { transform: none; }
      body.nav-open::after { content: ""; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); }
      .top .menu-btn { display: grid; }
      .top { padding: 10px 16px; gap: 10px; }
      .content { padding: 18px 16px 48px; }
      .banner { margin: 12px 16px 0; }
      .who div { display: none; }
      .search kbd { display: none; }
      .search input { padding-right: 14px; }
    }
    @media (max-width: 640px) {
      body { font-size: 13px; }
      .canteen-slots { grid-template-columns: 1fr; }
      .hr-contact-line { grid-template-columns: minmax(0, 1fr) auto; }
      .hr-contact-line .row-actions { width: auto; justify-content: flex-end; }
      .who { display: none; }
      .search { min-width: 0; }
      #adminBtn { padding: 0 12px; }
      .g-2, .g-4, .form-row, .actions { grid-template-columns: 1fr; }
      .page-head h1, .hero h1 { font-size: 21px; }
      .safety .big b { font-size: 37px; }
      .t th:nth-child(n+5), .t td:nth-child(n+5) { display: none; }
      .t.keep-all th, .t.keep-all td { display: table-cell; }
    }
    @media print {
      .side, .top, .foot, .toasts, #pdfOverlay { display: none !important; }
      .shell { display: block; }
    }
    /* =====================================================================
       FINAL LAYER (17 Nov 2026): compact type, classic fonts, aligned links.
       Delete this block to go back to the large-type look.
       ===================================================================== */
    :root {
      --font: Tahoma, Verdana, "Segoe UI", Arial, sans-serif;
      --font-head: Georgia, "Times New Roman", Times, serif;
      --radius: 10px;
    }
    body { line-height: 1.45; -webkit-font-smoothing: auto; }
    h1, h2, h3, .brand b, .kpi b, .safety .big b, .date-box b, .next-hol h2 { font-family: var(--font-head); letter-spacing: 0; font-weight: 700; }
    .tag, .sos h3, h2 small, h3 small { font-family: var(--font); }
    svg.i { width: 16px; height: 16px; stroke-width: 1.9; }

    /* Shell */
    .shell { grid-template-columns: 256px minmax(0, 1fr); }
    .side { padding: 14px 10px 14px; }
    .brand { gap: 10px; padding: 2px 6px 14px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 8px; }
    .nav-group { margin: 4px 0 8px; }
    .nav-title { padding: 6px 10px 4px; }
    .nav-link { min-height: 32px; gap: 10px; padding: 6px 10px; margin: 1px 0; border-radius: 7px; line-height: 1.2; }
    .nav-link span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .nav-link .nav-count { flex: 0 0 auto; min-width: 22px; padding: 0 6px; }
    .sos { padding: 10px 12px; border-radius: 9px; }
    .top { gap: 10px; padding: 8px 22px; }
    .search input { height: 36px; padding: 0 64px 0 36px; border-radius: 8px; }
    .search > svg { left: 11px; top: 10px; }
    .search kbd { top: 8px; right: 8px; padding: 1px 6px; line-height: 1.5; }
    .search-results { top: 42px; border-radius: 9px; }
    .sr-item { padding: 7px 8px; gap: 10px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 8px; }
    .who .av { width: 32px; height: 32px; }
    .content { padding: 18px 22px 40px; }
    .page-head { margin-bottom: 14px; }
    .foot { padding: 12px 22px; }
    .banner { margin: 10px 22px 0; padding: 8px 12px; border-radius: 9px; }

    /* Controls: one height per size so buttons, inputs and chips line up */
    .btn { min-height: 32px; padding: 0 12px; gap: 6px; border-radius: 7px; }
    .btn-sm { min-height: 28px; padding: 0 9px; border-radius: 6px; }
    .input, .select { min-height: 32px; padding: 5px 10px; border-radius: 7px; }
    .textarea { padding: 7px 10px; border-radius: 7px; min-height: 96px; }
    .field-inline svg { left: 10px; top: 8px; }
    .field-inline .input { padding-left: 32px; }
    .chip { min-height: 28px; padding: 0 11px; }
    .toolbar { gap: 8px; margin-bottom: 12px; }
    .form, .form-row { gap: 10px; }
    .form label { gap: 4px; }
    .check input { width: 15px; height: 15px; }

    /* Cards */
    .grid, .stack { gap: 14px; }
    .card-pad { padding: 14px 16px; }
    .card-head { min-height: 42px; padding: 8px 16px; }
    .card-head h2 { gap: 8px; }
    .more { display: inline-flex; align-items: center; line-height: 1.2; }
    .section-title { margin: 20px 0 10px; }
    .section-title h2 { line-height: 1.2; }

    /* Today */
    .hero { padding: 18px 22px; gap: 18px; border-radius: 12px; }
    .hero-shift { margin-top: 12px; gap: 8px; }
    .pill { padding: 5px 11px; gap: 6px; }
    .safety { padding: 12px 16px; border-radius: 10px; }
    .safety .big { margin: 2px 0 8px; }
    .bar { height: 8px; }
    .kpi { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-top-width: 4px; }
    .kpi a { margin-top: auto; padding-top: 4px; }
    .notice { gap: 12px; padding: 10px 16px; grid-template-columns: 4px minmax(0, 1fr); }
    .notice h3 { margin: 4px 0 2px; }
    .event { grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; padding: 9px 16px; }
    .date-box { border-radius: 8px; padding: 4px 0; }
    .shifts { gap: 6px; padding: 10px 16px 14px; }
    .shift { padding: 7px 12px; border-radius: 7px; }
    .actions { gap: 10px; }
    .action { grid-template-rows: auto auto 1fr; align-content: start; gap: 4px; padding: 12px 14px; border-radius: 10px; }
    .action .ic { width: 32px; height: 32px; border-radius: 8px; margin-bottom: 4px; }

    /* App links: every tile the same height, icon and text on one line each */
    .apps { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); grid-auto-rows: 1fr; gap: 10px; }
    .apps > div { display: grid; min-width: 0; }
    .app { height: 100%; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 9px 32px 9px 10px; border-radius: 9px; align-items: center; }
    .app > span:nth-child(2) { min-width: 0; }
    .app .logo { width: 34px; height: 34px; border-radius: 8px; }
    .app b { line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .app small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app .ext { top: 50%; right: 10px; transform: translateY(-50%); display: flex; }
    .app .ext svg.i { width: 14px; height: 14px; }
    .app-del { right: 4px; bottom: 4px; }
    .group-h { margin: 18px 0 10px; }
    .rdp { padding: 12px 14px; }
    .rdp h3 { margin-bottom: 6px; }
    .ep { padding: 7px 0; }
    .ep .btn { flex: 0 0 auto; }
    .warn-note { padding: 7px 10px; border-radius: 7px; }

    /* Tables and lists */
    .t th { padding: 8px 10px; }
    .t td { padding: 7px 10px; vertical-align: middle; }
    .pdf-name { align-items: center; }
    .pdf-name svg { flex-basis: 16px; }
    .doc-line, .hol { padding: 8px 16px; gap: 10px; }
    .doc-line .btn, .hol .del { flex: 0 0 auto; }
    .hol .date-box { width: 48px; }
    .next-hol { padding: 14px 16px; gap: 14px; }
    .next-hol .date-box { width: 68px; }
    .ticket { padding: 10px 16px; }
    .tabs { padding: 8px 16px; }
    .pager { padding: 8px 14px; }

    /* Directory: avatar and contact links on one grid */
    .people { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .person { grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 14px; }
    .person .av { width: 40px; height: 40px; }
    .person .lines { gap: 4px; margin-top: 6px; }
    .person .contact-line { margin-left: -52px; width: calc(100% + 52px); gap: 10px; }
    .person .lines svg { width: 14px; height: 14px; }
    .person .lines a, .person .lines span { gap: 6px; line-height: 1.3; }

    /* Modals and toasts */
    .modal-head { padding: 12px 16px; }
    .modal-body { padding: 14px 16px; }
    .modal-foot { padding: 10px 16px 14px; gap: 8px; }
    .browser-option { min-height: 48px; padding: 8px 12px; }
    .toast { padding: 10px 12px; border-radius: 9px; }
    .lock-note { padding: 8px 12px; }

    .doc-folder + .doc-folder { border-top: 1px solid var(--line); }
    .doc-folder-h { display: flex; align-items: center; gap: 8px; padding: 10px 16px 4px; color: var(--brand); }
    .doc-folder-h b { flex: 1 1 auto; color: var(--ink); }
    .form-section { margin: 6px 0 -2px; font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .form-section small { text-transform: none; letter-spacing: 0; font-weight: 600; }
    .hint { display: flex; gap: 6px; align-items: flex-start; margin: 0; font-size: 12px; color: var(--muted); }
    .hint svg.i { flex: 0 0 auto; margin-top: 1px; }
    .ticket-facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; }
    .ticket-facts div { display: flex; gap: 6px; align-items: center; }
    .ticket-facts dt { color: var(--muted); font-weight: 700; }
    .ticket-facts dd { margin: 0; display: flex; align-items: center; gap: 4px; }
    .ticket-facts .btn { min-height: 24px; padding: 0 6px; }
    .utility-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .utility { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
    .utility-head { display: flex; align-items: center; gap: 10px; }
    .utility-head .logo { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 800; flex: 0 0 auto; }
    .utility-head h2 { margin: 0; font-size: 15px; }
    .utility p { margin: 0; color: var(--muted); font-size: 12.5px; flex: 1 1 auto; }
    .utility .btn { align-self: flex-start; }
    .utility-notes p { margin: 0 0 8px; }
    .utility-notes code { font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
    #uHelp { margin-top: 14px; }
    .shift-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
    .shift-code { flex: 0 0 auto; min-width: 26px; padding: 1px 5px; border-radius: 5px; background: var(--surface-2); text-align: center; font-size: 11px; }
    .shift.on .shift-code { background: var(--ok); color: #fff; }
    .shift > span:last-child { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .table-scroll { overflow-x: auto; }
    .shift-table th, .shift-table td { white-space: nowrap; text-align: center; font-variant-numeric: tabular-nums; }
    .shift-table th:nth-child(2), .shift-table td.nm { text-align: left; }
    .shift-table td.nm { font-weight: 700; }
    .shift-table tr.on td { background: var(--ok-soft); }
    .bio-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .bio-tile { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: var(--bio); color: #fff; box-shadow: var(--shadow); }
    .bio-tile b { font-size: 26px; line-height: 1.1; font-family: var(--font-head); font-variant-numeric: tabular-nums; }
    .bio-tile span { font-size: 13px; font-weight: 700; opacity: .95; }
    .bio-note { display: flex; align-items: center; gap: 6px; margin: 8px 2px 0; font-size: 11.5px; color: var(--muted); }
    .bio-note.warn { color: var(--amber-ink); }
    @media (max-width: 900px) { .bio-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .bio-head { flex-wrap: wrap; gap: 8px 14px; }
    .bio-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-left: auto; font-size: 12px; font-weight: 700; color: var(--brand); }
    .bio-filters label { display: inline-flex; align-items: center; gap: 6px; }
    .bio-filters .select { width: auto; min-width: 120px; min-height: 30px; padding: 3px 8px; }
    .bio-table td, .bio-table th { white-space: nowrap; }
    .dev-st { font-weight: 700; text-transform: lowercase; }
    .dev-st.online { color: var(--ok); }
    .dev-st.offline { color: var(--crit); }
    .bio-foot { margin: 0; padding: 8px 16px; border-top: 1px solid var(--line); }
    .attach { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); max-width: 520px; }
    .attach > svg.i { color: var(--brand); flex: 0 0 auto; }
    .attach-name { flex: 1 1 auto; min-width: 0; font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach .btn { flex: 0 0 auto; }
    .file-input { padding: 5px 8px; }
    .form label.check { display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .form label.check input { flex: 0 0 auto; margin: 0; }
    .t-Marketing { background: rgba(219, 39, 119, .14); color: #c0266d; }
    .notice.c-Marketing .rail { background: #db2777; }
    .doc-title small.doc-meta { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .notice p a { color: var(--brand); font-weight: 700; overflow-wrap: anywhere; }
    /* SOPs & documents: group cards */
    .doc-chips { margin: -4px 0 14px; }
    .doc-groups { columns: 380px 3; column-gap: 14px; }
    .doc-groups > .card { display: block; break-inside: avoid; margin-bottom: 14px; }
    .doc-groups[hidden] { display: none; }
    .doc-group .card-head h2 { min-width: 0; }
    .doc-list { list-style: none; margin: 0; padding: 4px 0; }
    .doc-item { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; padding: 4px 16px; border-bottom: 1px solid var(--line-2); }
    .doc-item:last-child { border-bottom: 0; }
    .doc-item:hover { background: var(--surface-2); }
    .doc-ic { display: flex; color: var(--brand); }
    .doc-title { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; padding: 4px 0; }
    .doc-item .btn { min-width: 58px; }
    @media (prefers-reduced-motion: reduce) { .new-badge { animation: none; } }
    /* Logos from the logos folder; initials show until (or unless) an image loads */
    .logo, .browser-mark, .brand-mark { overflow: hidden; }
    .logo-img { display: none; width: 100%; height: 100%; object-fit: contain; }
    .has-img { background: #fff !important; border: 1px solid var(--line); padding: 4px; }
    .brand-mark.has-img { padding: 2px; border-color: transparent; }
    .has-img .logo-img { display: block; }
    .has-img .logo-txt { display: none; }
    /* Browser chooser rows */
    .browser-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-items: center; }
    .browser-row .btn { min-height: 48px; }
    .browser-option small { font-size: 11px; }
    .launcher-help { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--amber-soft); color: var(--amber-ink); font-size: 12px; line-height: 1.5; }
    .launcher-help small { display: block; margin-top: 6px; color: var(--muted); }
    .launcher-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .linkish { padding: 0; border: 0; background: none; color: var(--brand); font-weight: 700; text-decoration: underline; cursor: pointer; }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { width: 260px; }
      .top { padding: 8px 12px; }
      .content { padding: 14px 12px 36px; }
      .banner { margin: 10px 12px 0; }
      .search input { padding-right: 12px; }
    }

  </style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main menu">
    <a class="brand" href="#today" data-go="today">
      <span class="brand-mark"><img class="logo-img" src="/logos/company.png" data-logo="company" alt=""><span class="logo-txt">MT</span></span>
      <span class="brand-copy"><b>MT CNC-Group</b><small>Intranet Website</small></span>
    </a>
    <nav id="nav"></nav>
    <section class="sos" aria-label="Emergency contacts">
      <h3><svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>Emergency Contacts</h3>
      <ul id="sosList"></ul>
    </section>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search" role="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr-only" for="q">Search the intranet</label>
        <input id="q" type="search" autocomplete="off" placeholder="Search people, SOPs, notices, apps...">
        <kbd>Ctrl K</kbd>
        <div class="search-results" id="qResults" hidden></div>
      </div>
      <div class="top-meta">
        <div class="clock" aria-live="off"><b id="clockTime">--:--</b><small id="clockShift">Shift</small></div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark mode" title="Light / dark"></button>
        <div class="who" id="who"></div>
        <button class="btn btn-primary" id="adminBtn" type="button">
          <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Admin
        </button>
        <button class="btn" id="logoutBtn" type="button" hidden>Exit admin</button>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
    <footer class="foot">
      <span>&copy; Micro-Tech CNC Pvt. Ltd. &middot; MT CNC-Group intranet</span>
      <span id="liveState">Connecting to live updates&hellip;</span>
    </footer>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
  'use strict';
  /* =====================================================================
     MT CNC-Group Plant Hub - front end
     Employees: open directly (shared employee session, no password).
     Admin: "Admin" button -> user name + password -> edit everything.
     ===================================================================== */
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('mtc.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem('mtc.' + k, JSON.stringify(v)); } catch (_) {} }
  };

  /* ---------- Icons ---------- */
  const ICONS = {
    today: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    notices: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/>',
    documents: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    'employee-details': '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/>',
    apps: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    utilities: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="m9 8 2 2-2 2M13 12h2"/>',
    shifts: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    helpdesk: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
    directory: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
    'intercom-details': '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2.1z"/>',
    circulars: '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9h10M7 13h6M8 21h8M12 18v3"/>',
    quality: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
    marketing: '<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>',
    'hr-circulars': '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4h5v6h-5zM17.5 6.5h2M17.5 8h2"/>',
    'canteen-circulars': '<path d="M5 3v6M2.5 3v3.5a2.5 2.5 0 0 0 5 0V3M5 9v12"/><path d="M17 3c-2.2 0-3.5 2.2-3.5 4.5S14.8 12 17 12s3.5-2.2 3.5-4.5S19.2 3 17 3zM17 12v9"/>',
    hr: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/>',
    ideas: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
    assets: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    pin: '<path d="M12 17v5"/><path d="M9 3h6l-1 6 4 4H6l4-4z"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    ext: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    shield: '<path d="M12 3 19 6v5c0 4.6-2.9 8.1-7 10-4.1-1.9-7-5.4-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    gauge: '<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
    truck: '<path d="M3 6h11v9H3zM14 9h4l3 3v3h-7z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
    cog: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    download: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'
  };
  const icon = (name, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;

  /* ---------- Content that lives in the page (not in the API) ---------- */
  /* Biometric attendance figures, read (never changed) from eTimeTrack by the server. */
  const ETIME_LINK = 'http://time.microtechcnc.in:9002/Main.aspx';
  const BIO_TILES = [
    ['active', 'Active Employees', '#2290d0'],
    ['present', 'Present Employees', '#8fae2f'],
    ['online', 'Online Devices', '#9a6b3b'],
    ['offline', 'Offline Devices', '#b80000']
  ];
  const bio = { data: null, devices: [], fetched_at: null, error: '', stale: false, at: 0, loading: false, loc: '', status: '' };
  function renderBio() {
    if (!$('tBio')) return;
    const d = bio.data || {};
    $('tBio').innerHTML = BIO_TILES.map(([k, label, color]) => `<div class="bio-tile" style="--bio:${color}"><b>${d[k] == null ? (bio.loading && !bio.data ? '…' : '--') : esc(Number(d[k]).toLocaleString('en-IN'))}</b><span>${esc(label)}</span></div>`).join('');
    const when = bio.fetched_at ? fmtStamp(bio.fetched_at) : '';
    $('tBioNote').className = 'bio-note' + (bio.error ? ' warn' : '');
    $('tBioNote').innerHTML = bio.error
      ? `${icon('shield')}${esc(bio.error)}${bio.stale && when ? ` Showing the last figures from ${esc(when)}.` : ''}`
      : when ? `Live from eTimeTrack · updated ${esc(when)} · read-only, nothing in eTimeTrack is changed` : 'Loading from eTimeTrack…';
    renderDevices();
  }
  function renderDevices() {
    if (!$('bioRows')) return;
    const all = bio.devices || [];

  function updatePdfPageIndicator(pdf) {
    const wrap = $('pdfFrameWrap');
    const label = $('pdfPageLabel');
    const host = $('pdfCanvasHost');
    if (activePdf !== pdf || !wrap || !label || !host) return;
    const center = wrap.getBoundingClientRect().top + wrap.clientHeight / 2;
    let nearest = pdf.page || 1;
    let distance = Infinity;
    for (const shell of host.querySelectorAll('.pdf-page-shell')) {
      const rect = shell.getBoundingClientRect();
      const currentDistance = Math.abs(rect.top + rect.height / 2 - center);
      if (currentDistance < distance) { distance = currentDistance; nearest = Number(shell.dataset.page) || nearest; }
    }
    pdf.page = nearest;
    label.textContent = `Page ${nearest} of ${pdf.document ? pdf.document.numPages : 1}`;
  }
  async function renderPdfPage(pdf, pageNumber, shell, scale, generation) {
    if (activePdf !== pdf || generation !== pdf.renderGeneration || pdf.renderedPages.has(pageNumber) || pdf.renderTasks.has(pageNumber)) return;
    let task = null;
    try {
      const page = await pdf.document.getPage(pageNumber);
      if (activePdf !== pdf || generation !== pdf.renderGeneration || !shell.isConnected) return;
      const viewport = page.getViewport({ scale });
      const ratio = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      const canvas = document.createElement('canvas');
      canvas.className = 'pdf-canvas';
      canvas.width = Math.ceil(viewport.width * ratio);
      canvas.height = Math.ceil(viewport.height * ratio);
      canvas.style.width = `${Math.ceil(viewport.width)}px`;
      canvas.style.height = `${Math.ceil(viewport.height)}px`;
      canvas.setAttribute('aria-label', `PDF page ${pageNumber}`);
      shell.replaceChildren(canvas);
      task = page.render({ canvasContext: canvas.getContext('2d', { alpha: false }), viewport, transform: ratio === 1 ? null : [ratio, 0, 0, ratio, 0, 0] });
      pdf.renderTasks.set(pageNumber, task);
      await task.promise;
      if (activePdf === pdf && generation === pdf.renderGeneration) pdf.renderedPages.add(pageNumber);
    } catch (error) {
      if (error && error.name === 'RenderingCancelledException') return;
      if (activePdf === pdf && generation === pdf.renderGeneration && shell.isConnected) shell.innerHTML = `<div class="pdf-page-placeholder">Page ${pageNumber} could not be displayed.</div>`;
    } finally {
      if (pdf.renderTasks.get(pageNumber) === task) pdf.renderTasks.delete(pageNumber);
    }
  }
  async function renderPdfPages(pdf, preservePage = true) {
    if (activePdf !== pdf || !pdf.document || !$('pdfCanvasHost')) return;
    const savedPage = preservePage ? pdf.page : 1;
    const host = $('pdfCanvasHost');
    const wrap = $('pdfFrameWrap');
    const generation = ++pdf.renderGeneration;
    if (pdf.pageObserver) pdf.pageObserver.disconnect();
    for (const task of pdf.renderTasks.values()) { try { task.cancel(); } catch (_) {} }
    pdf.renderTasks.clear();
    pdf.renderedPages.clear();
    host.replaceChildren();
    const pageCount = pdf.document.numPages;
    const availableWidth = Math.max(240, wrap.clientWidth - 40);
    const pageScales = [];
    for (let pageNumber = 1; pageNumber <= pageCount; pageNumber++) {
      const page = await pdf.document.getPage(pageNumber);
      if (activePdf !== pdf || generation !== pdf.renderGeneration) return;
      const base = page.getViewport({ scale: 1 });
      const scale = pdf.zoom === 'page-width'
        ? Math.max(.5, Math.min(2.5, availableWidth / base.width))
        : Number(pdf.zoom) / 100;
      const viewport = page.getViewport({ scale });
      pageScales.push(scale);
      const shell = document.createElement('div');
      shell.className = 'pdf-page-shell';
      shell.dataset.page = String(pageNumber);
      shell.style.width = `${Math.ceil(viewport.width)}px`;
      shell.style.height = `${Math.ceil(viewport.height)}px`;
      shell.setAttribute('aria-label', `PDF page ${pageNumber} of ${pageCount}`);
      shell.innerHTML = `<div class="pdf-page-placeholder">Loading page ${pageNumber}…</div>`;
      host.appendChild(shell);
    }
    $('pdfPageLabel').textContent = `Page ${savedPage} of ${pageCount}`;
    pdf.pageObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const shell = entry.target;
        const pageNumber = Number(shell.dataset.page);
        if (entry.isIntersecting) renderPdfPage(pdf, pageNumber, shell, pageScales[pageNumber - 1], generation);
        else if (pdf.renderedPages.has(pageNumber)) {
          shell.innerHTML = `<div class="pdf-page-placeholder">Page ${pageNumber}</div>`;
          pdf.renderedPages.delete(pageNumber);
        }
      }
      updatePdfPageIndicator(pdf);
    }, { root: wrap, rootMargin: '850px 0px', threshold: 0 });
    for (const shell of host.querySelectorAll('.pdf-page-shell')) pdf.pageObserver.observe(shell);
    if (preservePage && savedPage > 1) {
      const target = host.querySelector(`.pdf-page-shell[data-page="${savedPage}"]`);
      if (target) target.scrollIntoView({ block: 'start' });
    }
    updatePdfPageIndicator(pdf);
  }

  const logoImg = (key) => `<img class="logo-img" src="/logos/${encodeURIComponent(key)}.png" data-logo="${esc(key)}" alt="" decoding="async">`;
  function logoLoaded(img) {

  function logoFailed(img) {

  const isLogo = (el) => el instanceof HTMLImageElement && !!el.dataset.logo;

  const COLORS = ['#1d4f7a', '#1d7a46', '#6a3fb5', '#b86a00', '#0b6fb8', '#b42318', '#0f766e', '#334155'];
  const colorFor = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
  const safeUrl = (u) => /^https?:\/\//i.test(String(u || '')) ? u : '#';

  const ATTACH_EXT = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'jpg', 'jpeg', 'png'];

  /* ---------- Browser chooser for business apps ----------

  const BROWSERS = [
